[Loggers]
cmm_run_data_purgifier_logger=INFO
micro_vu_file_mover_logger=INFO
cmm_file_mover_logger=INFO

[CMMRunDataPurgifier]
root_path = V:\Inspect Programs\CMM Run Data
cmm_prg_days_to_keep = 90
cmm_cad_days_to_keep = 1


[ReportFileArchivers]
file_archivers = MicroVUFileMover, CMMFileMover

[MicroVUFileMover]
root_path = S:\Micro-Vu\
archive_path = S:\Micro-Vu\Archives
mv_days_to_keep = 30

[CMMFileMover]
root_path = S:\CMM
cmm_days_to_keep = 90