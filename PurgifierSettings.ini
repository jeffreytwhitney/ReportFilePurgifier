[Loggers]
cmm_run_data_purgifier_logger=INFO
file_mover_logger=INFO

[CMMRunDataPurgifier]
root_path = V:\Inspect Programs\CMM Run Data
cmm_prg_days_to_keep = 90
cmm_cad_days_to_keep = 1

[ReportFileMovers]
file_movers = MicroVUFileMover,CMMFileMover,SmartProfileFileMover

[MicroVUFileMover]
root_path = S:\Micro-Vu
archive_path = S:\Micro-Vu\Archives
days_to_keep = 30

[SmartProfileFileMover]
root_path = S:\Smart Profile
archive_path = S:\Smart Profile\Archives
days_to_keep = 60

[CMMFileMover]
root_path = S:\CMM
archive_path = S:\CMM\Archives
days_to_keep = 90